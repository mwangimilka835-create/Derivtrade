<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TraderWin.com – Trade. Win. Repeat.</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700;900&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green: #00e676;
    --green-dim: #00c853;
    --green-dark: #007a33;
    --black: #050a05;
    --surface: #0c140c;
    --surface2: #111a11;
    --surface3: #162016;
    --border: rgba(0,230,118,0.15);
    --text: #e8f5e9;
    --muted: #7a9a7a;
    --white: #ffffff;
    --red: #ff1744;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Barlow', sans-serif; background: var(--black); color: var(--text); overflow-x: hidden; line-height: 1.6; }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: 0.4;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--black); }
  ::-webkit-scrollbar-thumb { background: var(--green-dark); border-radius: 3px; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 5%; height: 72px;
    background: rgba(5,10,5,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); transition: all 0.3s;
  }
  nav.scrolled { height: 60px; background: rgba(5,10,5,0.98); }
  .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav-logo img { height: 42px; width: 42px; object-fit: contain; border-radius: 6px; }
  .nav-logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 1px; color: var(--white); }
  .nav-logo-text span { color: var(--green); }
  .nav-links { display: flex; align-items: center; gap: 2rem; list-style: none; }
  .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; transition: color 0.2s; }
  .nav-links a:hover { color: var(--green); }

  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px; border-radius: 4px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 0.95rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.25s; text-decoration: none; border: none; }
  .btn-primary { background: var(--green); color: var(--black); }
  .btn-primary:hover { background: #fff; color: var(--black); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,230,118,0.35); }
  .btn-outline { background: transparent; color: var(--green); border: 1.5px solid var(--green); }
  .btn-outline:hover { background: var(--green); color: var(--black); transform: translateY(-2px); }

  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; }
  .hamburger span { display: block; width: 24px; height: 2px; background: var(--green); border-radius: 2px; transition: all 0.3s; }
  .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .mobile-menu { display: none; position: fixed; top: 72px; left: 0; right: 0; background: rgba(5,10,5,0.98); border-bottom: 1px solid var(--border); padding: 1.5rem 5%; z-index: 999; flex-direction: column; gap: 1.2rem; }
  .mobile-menu.open { display: flex; }
  .mobile-menu a { color: var(--text); text-decoration: none; font-size: 1.1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }

  /* DERIV DASHBOARD */
  .deriv-dashboard {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0;
  }
  .deriv-bar {
    max-width: 1280px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.6rem 5%; flex-wrap: wrap; gap: 0.8rem;
  }
  .deriv-status {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  }
  .deriv-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
    transition: background 0.3s;
  }
  .deriv-dot.connected { background: var(--green); animation: pulse 1.5s infinite; }
  .deriv-dot.error { background: var(--red); }
  .deriv-metrics { display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center; }
  .d-metric { display: flex; flex-direction: column; align-items: flex-end; }
  .d-metric-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .d-metric-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--green); line-height: 1.1; }
  .d-metric-value.loss { color: var(--red); }
  .d-metric-value.neutral { color: var(--white); }

  /* TICKER */
  .ticker-bar { position: relative; z-index: 2; background: var(--black); border-bottom: 1px solid var(--border); overflow: hidden; height: 44px; display: flex; align-items: center; }
  .ticker-inner { display: flex; animation: ticker 28s linear infinite; white-space: nowrap; }
  @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .ticker-item { display: flex; align-items: center; gap: 8px; padding: 0 2rem; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.5px; border-right: 1px solid var(--border); }
  .ticker-item .sym { color: var(--muted); }
  .ticker-item .price { color: var(--white); }
  .ticker-item .up { color: var(--green); }
  .ticker-item .down { color: var(--red); }

  /* HERO */
  .hero { min-height: 100vh; display: flex; align-items: center; padding: 100px 5% 60px; position: relative; overflow: hidden; }
  .hero-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 60% 40%, rgba(0,230,118,0.07) 0%, transparent 60%), radial-gradient(ellipse 40% 40% at 10% 80%, rgba(0,200,83,0.05) 0%, transparent 50%), linear-gradient(180deg, var(--black) 0%, var(--surface) 100%); }
  .hero-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,230,118,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,230,118,0.04) 1px, transparent 1px); background-size: 60px 60px; animation: gridScroll 20s linear infinite; }
  @keyframes gridScroll { 0% { transform: translateY(0); } 100% { transform: translateY(60px); } }
  .hero-content { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center; max-width: 1280px; margin: 0 auto; width: 100%; }
  .hero-tag { display: inline-flex; align-items: center; gap: 8px; background: rgba(0,230,118,0.1); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--green); margin-bottom: 1.2rem; }
  .hero-tag::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
  .hero h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3.2rem, 6vw, 6rem); line-height: 0.95; letter-spacing: 1px; margin-bottom: 1.4rem; color: var(--white); }
  .hero h1 .accent { color: var(--green); }
  .hero h1 .outline { -webkit-text-stroke: 2px var(--green); color: transparent; }
  .hero-sub { font-size: 1.1rem; color: var(--muted); max-width: 480px; margin-bottom: 2.2rem; font-weight: 400; line-height: 1.7; }
  .hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2.8rem; }
  .hero-stats { display: flex; gap: 2rem; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--green); line-height: 1; }
  .stat-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .hero-visual { position: relative; display: flex; justify-content: center; align-items: center; }
  .hero-logo-wrap { position: relative; width: 420px; max-width: 100%; }
  .hero-logo-wrap::before { content: ''; position: absolute; inset: -40px; background: radial-gradient(circle, rgba(0,230,118,0.15) 0%, transparent 70%); border-radius: 50%; animation: glow 3s ease-in-out infinite alternate; }
  @keyframes glow { 0% { opacity: 0.5; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1.05); } }
  .hero-logo-wrap img { width: 100%; border-radius: 16px; position: relative; z-index: 1; filter: drop-shadow(0 0 40px rgba(0,230,118,0.3)); }

  section { padding: 80px 5%; }
  .container { max-width: 1280px; margin: 0 auto; }
  .section-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 0.78rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--green); margin-bottom: 0.6rem; }
  .section-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2.2rem, 4vw, 3.6rem); color: var(--white); line-height: 1; margin-bottom: 1rem; }
  .section-title span { color: var(--green); }
  .section-sub { color: var(--muted); max-width: 560px; font-size: 1rem; line-height: 1.7; margin-bottom: 3rem; }

  /* ACCOUNT PANEL */
  .account-section { background: var(--surface); }
  .account-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; margin-top: 2rem; }
  .account-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 1.8rem; transition: all 0.3s; }
  .account-card:hover { border-color: var(--green); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,230,118,0.1); }
  .account-card-title { font-family: 'Barlow Condensed', sans-serif; font-size: 0.78rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; }
  .account-card-title .refresh-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem; transition: color 0.2s; padding: 2px; }
  .account-card-title .refresh-btn:hover { color: var(--green); }
  .big-value { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; color: var(--white); line-height: 1; margin-bottom: 0.3rem; }
  .big-value .currency { font-size: 1.2rem; color: var(--muted); }
  .value-change { font-size: 0.85rem; font-weight: 600; }
  .value-change.pos { color: var(--green); }
  .value-change.neg { color: var(--red); }

  /* POSITIONS TABLE */
  .positions-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  .positions-table th { font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); padding: 0.6rem 0.8rem; text-align: left; border-bottom: 1px solid var(--border); }
  .positions-table td { font-size: 0.88rem; padding: 0.7rem 0.8rem; border-bottom: 1px solid rgba(0,230,118,0.05); color: var(--text); }
  .positions-table tr:hover td { background: rgba(0,230,118,0.03); }
  .pos-profit { color: var(--green); font-weight: 700; }
  .pos-loss { color: var(--red); font-weight: 700; }
  .pos-buy { color: var(--green); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; background: rgba(0,230,118,0.1); padding: 2px 8px; border-radius: 3px; }
  .pos-sell { color: var(--red); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; background: rgba(255,23,68,0.1); padding: 2px 8px; border-radius: 3px; }
  .empty-state { text-align: center; color: var(--muted); font-size: 0.88rem; padding: 2rem; }

  /* HISTORY TABLE */
  .history-section { background: var(--black); }
  .history-filters { display: flex; gap: 0.6rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .filter-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 6px 16px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s; font-family: 'Barlow Condensed', sans-serif; }
  .filter-btn.active, .filter-btn:hover { background: rgba(0,230,118,0.1); border-color: var(--green); color: var(--green); }

  /* ANALYSIS */
  .analysis-section { background: var(--surface); }
  .analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 2rem; }
  .analysis-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 1.8rem; }
  .analysis-card h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--white); margin-bottom: 1.2rem; }
  .win-rate-ring { display: flex; align-items: center; gap: 1.5rem; }
  .ring-wrap { position: relative; width: 100px; height: 100px; flex-shrink: 0; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: rgba(0,230,118,0.1); stroke-width: 8; }
  .ring-fill { fill: none; stroke: var(--green); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1.5s ease; }
  .ring-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--green); }
  .analysis-stats { display: flex; flex-direction: column; gap: 0.6rem; flex: 1; }
  .a-stat { display: flex; justify-content: space-between; font-size: 0.85rem; }
  .a-stat span:first-child { color: var(--muted); }
  .a-stat span:last-child { color: var(--white); font-weight: 600; }
  .symbol-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .symbol-row { display: flex; align-items: center; gap: 0.8rem; }
  .symbol-row .sym-name { color: var(--muted); font-size: 0.82rem; width: 70px; flex-shrink: 0; }
  .sym-bar-wrap { flex: 1; height: 6px; background: rgba(0,230,118,0.08); border-radius: 3px; overflow: hidden; }
  .sym-bar { height: 100%; background: linear-gradient(90deg, var(--green-dark), var(--green)); border-radius: 3px; transition: width 1s ease; }
  .sym-pct { font-size: 0.78rem; color: var(--green); font-weight: 700; width: 36px; text-align: right; flex-shrink: 0; }

  /* HOW IT WORKS */
  .how-section { background: var(--surface); }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 3rem; }
  .step { background: var(--surface2); padding: 2.5rem 2rem; position: relative; overflow: hidden; transition: transform 0.3s; }
  .step:hover { transform: translateY(-4px); }
  .step::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--green), var(--green-dim)); transform: scaleX(0); transform-origin: left; transition: transform 0.4s; }
  .step:hover::before { transform: scaleX(1); }
  .step-num { font-family: 'Bebas Neue', sans-serif; font-size: 5rem; color: rgba(0,230,118,0.08); line-height: 1; position: absolute; top: 1rem; right: 1.5rem; }
  .step-icon { width: 52px; height: 52px; background: rgba(0,230,118,0.1); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.2rem; font-size: 1.4rem; }
  .step h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 1.3rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--white); margin-bottom: 0.6rem; }
  .step p { color: var(--muted); font-size: 0.92rem; line-height: 1.6; }

  /* SIGNALS */
  .signals-section { background: var(--black); }
  .signal-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 2.5rem; }
  .signal-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; transition: all 0.3s; }
  .signal-card:hover { border-color: var(--green); transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,230,118,0.12); }
  .signal-header { padding: 1rem 1.2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .signal-pair { font-family: 'Barlow Condensed', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--white); letter-spacing: 1px; }
  .signal-type { font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 3px; text-transform: uppercase; letter-spacing: 1px; }
  .buy { background: rgba(0,230,118,0.15); color: var(--green); border: 1px solid rgba(0,230,118,0.3); }
  .sell { background: rgba(255,23,68,0.15); color: var(--red); border: 1px solid rgba(255,23,68,0.3); }
  .signal-body { padding: 1.2rem; }
  .signal-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
  .signal-row span:first-child { color: var(--muted); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .signal-row span:last-child { color: var(--text); font-size: 0.9rem; font-weight: 600; }
  .signal-row .profit { color: var(--green); }
  .mini-chart { height: 50px; margin-top: 1rem; border-radius: 4px; overflow: hidden; background: var(--surface3); display: flex; align-items: flex-end; gap: 2px; padding: 4px; }
  .bar { flex: 1; border-radius: 2px 2px 0 0; }

  /* PRICING */
  .pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 3rem; align-items: start; }
  .pricing-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 2.5rem 2rem; position: relative; transition: all 0.3s; }
  .pricing-card:hover { transform: translateY(-5px); }
  .pricing-card.featured { background: var(--surface3); border-color: var(--green); transform: translateY(-8px); box-shadow: 0 20px 60px rgba(0,230,118,0.15); }
  .featured-badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--green); color: var(--black); font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; padding: 4px 16px; border-radius: 20px; }
  .plan-name { font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 0.8rem; }
  .plan-price { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; color: var(--white); line-height: 1; margin-bottom: 0.3rem; }
  .plan-price sup { font-size: 1.5rem; vertical-align: top; margin-top: 0.8rem; display: inline-block; color: var(--muted); }
  .plan-period { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.8rem; }
  .plan-features { list-style: none; margin-bottom: 2rem; }
  .plan-features li { display: flex; align-items: center; gap: 10px; padding: 0.55rem 0; border-bottom: 1px solid rgba(0,230,118,0.06); font-size: 0.9rem; color: var(--text); }
  .plan-features li::before { content: '✓'; color: var(--green); font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
  .plan-features li.no::before { content: '×'; color: var(--muted); }
  .plan-features li.no { color: var(--muted); }

  /* TESTIMONIALS */
  .testimonials-section { background: var(--surface); }
  .testi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 2.5rem; }
  .testi-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8p

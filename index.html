<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraderScheme</title>
    <style>
        /* Boot Sequence Overlay */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050a14; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .brain-icon { width: 150px; height: 150px; background: #007bff; border-radius: 50%; margin-bottom: 20px; box-shadow: 0 0 50px #007bff; }
        .progress-bar { width: 80%; height: 5px; background: #222; margin-top: 20px; }
        #progress { height: 100%; width: 0%; background: #007bff; transition: 0.1s; }

        /* Main App Styling */
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; }
        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        nav { display: flex; background: #161b22; padding: 15px; justify-content: space-around; }
    </style>
</head>
<body>

<div id="preloader">
    <div class="brain-icon"></div>
    <h2 id="boot-text">Initializing D-Bot...</h2>
    <div class="progress-bar"><div id="progress"></div></div>
    <p>Boot sequence <span id="percent">0</span>%</p>
</div>

<div id="main-content" style="display: none;">
    <nav>
        <button onclick="switchPage('dashboard')">Dashboard</button>
        <button onclick="switchPage('manual')">Manual</button>
    </nav>
    <div id="dashboard" class="page active"><h1>Dashboard</h1></div>
    <div id="manual" class="page"><h1>Manual Trader</h1></div>
</div>

<script>
    // Boot Sequence Logic
    let p = 0;
    const progress = document.getElementById('progress');
    const percent = document.getElementById('percent');
    const bootText = document.getElementById('boot-text');

    const loader = setInterval(() => {
        p++;
        progress.style.width = p + "%";
        percent.innerText = p;

        if (p === 50) bootText.innerText = "Initializing your account...";
        if (p >= 100) {
            clearInterval(loader);
            document.getElementById('preloader').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }
    }, 50); // Speed of loading

    // Tab Switching Logic
    function switchPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
</body>
</html>

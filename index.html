<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traderwin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
header { background: #1e293b; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 1.5rem; font-weight: bold; color: #3b82f6; }
.balance { background: #334155; padding: 0.5rem 1rem; border-radius: 8px; }
.container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
.card { background: #1e293b; padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; }
.btn { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn:hover { background: #2563eb; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
</style>
</head>
<body>
<header>
  <div class="logo">Traderwin</div>
  <div class="balance">Balance: <span id="balance">--</span> USD</div>
</header>

<div class="container">
  <div class="card">
    <h2>Connect to Deriv</h2>
    <button class="btn" onclick="connectDeriv()">Connect Account</button>
    <p id="status" style="margin-top: 1rem; color: #94a3b8;">Not connected</p>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Quick Trade</h3>
      <button class="btn" onclick="alert('Trade logic goes here')">Buy</button>
    </div>
    <div class="card">
      <h3>Market Data</h3>
      <p id="market">Loading...</p>
    </div>
  </div>
</div>

<script>
// Your Deriv App ID - replace with your own from developers.deriv.com
const app_id = 12345;

function connectDeriv() {
  document.getElementById('status').textContent = 'Connecting...';
  // Add Deriv API connection logic here
  setTimeout(() => {
    document.getElementById('status').textContent = 'Connected';
    document.getElementById('balance').textContent = '1000.00';
  }, 1500);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraderWin Platform</title>
    <style>
        :root { --bg: #050a14; --panel: #161b22; --accent: #007bff; --text: #e6edf3; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; }
        
        /* BOOT SEQUENCE */
        #preloader { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .brain-icon { width: 180px; height: 180px; background: url('IMG-20260529-WA0025.jpg') no-repeat center; background-size: contain; margin-bottom: 20px; }
        .progress-bar { width: 70%; height: 6px; background: #222; border-radius: 3px; }
        #progress { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: 0.1s; }

        /* DASHBOARD */
        #main-content { display: none; }
        header { background: var(--panel); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222; }
        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        .card { background: var(--panel); padding: 20px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #30363d; }
        .btn-trade { padding: 15px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; width: 48%; }
    /* Signal Wave Animation */
.wave-container { display: flex; align-items: center; justify-content: center; gap: 5px; height: 30px; }
.wave { width: 5px; height: 20px; background: #007bff; animation: pulse 1s infinite; }
.wave:nth-child(2) { animation-delay: 0.2s; }
.wave:nth-child(3) { animation-delay: 0.4s; }
.wave:nth-child(4) { animation-delay: 0.6s; }

@keyframes pulse {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(2.5); }
}
    </style>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<div id="preloader">
    <div class="brain-icon"></div>
    <div class="progress-bar"><div id="progress"></div></div>
</div>


    <div id="main-content">
    <header>
        <div style="font-weight: bold; font-size: 1.2em;">TRADERWIN</div>
        <div id="balance-display" style="background: #000; padding: 5px 10px; border-radius: 5px; color: #4caf50;">Connecting...</div>
    </header>

    <div id="chart-container" style="width: 100%; height: 300px; margin-bottom: 20px; background: #161b22;"></div>
<div id="dash" class="page active">
    <div id="chart-container" style="width: 100%; height: 300px; margin-bottom: 20px; background: #161b22; border-radius: 8px;"></div>

    <div class="card">
        <h3 style="color: #4caf50; font-size: 0.9em;">● LIVE TRADING SIGNALS</h3>
        <div id="signal-box" style="text-align: center; padding: 10px;">
            <div class="wave-container">
                <div class="wave"></div><div class="wave"></div><div class="wave"></div><div class="wave"></div>
            </div>
            <p style="font-size: 0.8em; margin-top: 10px;">Scanning markets...</p>
        </div>
    </div>

    <div class="card">
        <button class="btn-trade" style="background:#28a745; width:48%;" onclick="placeTrade('CALL')">BUY RISE</button>
        <button class="btn-trade" style="background:#dc3545; width:48%;" onclick="placeTrade('PUT')">BUY FALL</button>
    </div>
</div>


<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script>
    // 1. CONFIGURATION
    const apiToken = "pat_ed586a9ab1ede610dca73cad956da3af12e8027bf2cf3e5a72797dcd9f9e27c1"; 
    const app_id = "33egwMbRPIkA8tEiGipbD"; 

    // 2. BOOT LOGIC
    let p = 0;
    const loader = setInterval(() => {
        p += 2;
        document.getElementById('progress').style.width = p + "%";
        if (p >= 100) {
            clearInterval(loader);
            document.getElementById('preloader').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }
    }, 40);

    // 3. CHART INITIALIZATION
    const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
        layout: { backgroundColor: '#161b22', textColor: '#ddd' },
        width: document.getElementById('chart-container').offsetWidth,
        height: 300,
    });
    const lineSeries = chart.addLineSeries({ color: '#007bff' });

    // 4. API & TRADING LOGIC
    const ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${app_id}`);
    
    ws.onopen = () => {
        ws.send(JSON.stringify({ authorize: apiToken }));
        ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
        ws.send(JSON.stringify({ ticks: "R_10", subscribe: 1 }));
    };

    ws.onmessage = (msg) => {
        const res = JSON.parse(msg.data);
        
        // Handle Balance
        if (res.balance) {
            document.getElementById('balance-display').innerText = 
                `${res.balance.balance} ${res.balance.currency}`;
        }
        // Handle Chart Ticks
        else if (res.tick) {
            lineSeries.update({ time: res.tick.epoch, value: res.tick.quote });
        }
        // Handle Trade Execution
        else if (res.proposal) {
            ws.send(JSON.stringify({ buy: res.proposal.id, price: 0 }));
        }
        else if (res.buy) {
            alert("Trade Successful! Contract: " + res.buy.contract_id);
        }
    };

    function placeTrade(type) {
        ws.send(JSON.stringify({
            proposal: 1,
            amount: 10,
            basis: "stake",
            contract_type: type,
            currency: "USD",
            duration: 5,
            duration_unit: "t",
            symbol: "R_10"
        }));
    }
    let isBotRunning = false;

function runBot() {
    isBotRunning = !isBotRunning;
    const btn = document.querySelector('#bots button');
    
    if (isBotRunning) {
        btn.innerText = "STOP BOT";
        btn.style.background = "#dc3545";
        console.log("Bot started with strategy: " + document.getElementById('strategy').value);
        // Add your WebSocket trigger here to begin the loop
    } else {
        btn.innerText = "START AUTOMATED BOT";
        btn.style.background = "#007bff";
    }
    }
</script>
</body>
</html>

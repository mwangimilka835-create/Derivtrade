<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraderWin Platform</title>
    <style>
        :root { --bg: #050a14; --panel: #161b22; --accent: #007bff; --text: #e6edf3; }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; }
        
        /* BOOT SEQUENCE */
        #preloader { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .brain-icon { width: 180px; height: 180px; background: url('IMG-20260529-WA0025.jpg') no-repeat center; background-size: contain; margin-bottom: 20px; }
        .progress-bar { width: 70%; height: 6px; background: #222; border-radius: 3px; }
        #progress { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: 0.1s; }

        /* DASHBOARD */
        #main-content { display: none; }
        header { background: var(--panel); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222; }
        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        .card { background: var(--panel); padding: 20px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #30363d; }
        .btn-trade { padding: 15px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; width: 48%; }
    </style>
</head>
<body>

<div id="preloader">
    <div class="brain-icon"></div>
    <div class="progress-bar"><div id="progress"></div></div>
</div>

<div id="main-content">
    <header>
        <div style="font-weight: bold; font-size: 1.2em;">TRADERWIN</div>
        <div id="balance-display" style="background: #000; padding: 5px 10px; border-radius: 5px; color: #4caf50;">Connecting...</div>
    </header>

    <div id="dash" class="page active">
        <div class="card">
            <h3>Live Market Status</h3>
            <p id="signal-status">Scanning for entry points...</p>
        </div>
        <div class="card">
            <button class="btn-trade" style="background:#28a745;" onclick="placeTrade('CALL')">BUY RISE</button>
            <button class="btn-trade" style="background:#dc3545;" onclick="placeTrade('PUT')">BUY FALL</button>
        </div>
    </div>
</div>

<script>
    // 1. ADD YOUR TOKEN HERE
    const apiToken = "YOUR_TOKEN_HERE"; 
    const app_id = "1089"; 

    // 2. BOOT LOGIC
    let p = 0;
    const loader = setInterval(() => {
        p += 2;
        document.getElementById('progress').style.width = p + "%";
        if (p >= 100) {
            clearInterval(loader);
            document.getElementById('preloader').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }
    }, 40);

    // 3. API LOGIC
    const ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${app_id}`);
    let lastProposalId = null;
    
    ws.onopen = () => {
        ws.send(JSON.stringify({ authorize: apiToken }));
        // Subscribe to balance updates
        ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
    };

    ws.onmessage = (msg) => {
        const res = JSON.parse(msg.data);
        
        // Handle Balance
        if (res.balance) {
            document.getElementById('balance-display').innerText = 
                `${res.balance.balance} ${res.balance.currency}`;
        } 
        // Handle Proposal (Price check before buying)
        else if (res.proposal) {
            lastProposalId = res.proposal.id;
            console.log("Proposal Received: " + res.proposal.payout);
            // Auto-buy if you want, or show a confirm dialog
            ws.send(JSON.stringify({ buy: lastProposalId, price: 0 }));
        } 
        // Handle Purchase confirmation
        else if (res.buy) {
            alert("Trade Placed! Contract ID: " + res.buy.contract_id);
        }
    };

    // 4. TRADE EXECUTION
    function placeTrade(type) {
        // Request a proposal for Volatility 10 (1s) index
        const req = {
            proposal: 1,
            amount: 10, // Stake amount
            basis: "stake",
            contract_type: type, // 'CALL' or 'PUT'
            currency: "USD",
            duration: 5,
            duration_unit: "t",
            symbol: "R_10" 
        };
        ws.send(JSON.stringify(req));
    }
</script>
</body>
</html>

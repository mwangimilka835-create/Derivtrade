<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraderWin - Trade. Win. Repeat.</title>
    <style>
        body { background-color: #050a14; color: #fff; font-family: sans-serif; margin: 0; }
        
        /* Boot Sequence */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050a14; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
        }
        
        /* Updated Brain Icon using your image */
        .brain-icon { 
            width: 200px; height: 200px; 
            background: url('IMG-20260529-WA0025.jpg') no-repeat center center;
            background-size: contain; margin-bottom: 20px;
        }
        
        .progress-bar { width: 60%; height: 4px; background: #222; margin-top: 20px; border-radius: 2px; }
        #progress { height: 100%; width: 0%; background: #4caf50; transition: 0.1s; border-radius: 2px; }

        /* Branding Text */
        .brand-name { font-size: 1.5em; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div id="preloader">
    <div class="brain-icon"></div>
    <div class="brand-name">TRADERWIN.com</div>
    <h2 id="boot-text">Initializing D-Bot...</h2>
    <div class="progress-bar"><div id="progress"></div></div>
    <p>Boot sequence <span id="percent">0</span>%</p>
</div>

<div id="main-content" style="display: none;">
    <h1 style="text-align: center; margin-top: 50px;">Welcome to TraderWin</h1>
</div>

<script>
    let p = 0;
    const progress = document.getElementById('progress');
    const percent = document.getElementById('percent');
    const bootText = document.getElementById('boot-text');

    const loader = setInterval(() => {
        p++;
        progress.style.width = p + "%";
        percent.innerText = p;

        if (p === 30) bootText.innerText = "Initializing your account...";
        if (p === 60) bootText.innerText = "Syncing signals...";
        if (p >= 100) {
            clearInterval(loader);
            document.getElementById('preloader').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }
    }, 40); 
</script>
</body>
</html>
